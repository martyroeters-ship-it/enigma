# USD per 1M tokens, keyed by <provider>/<model_id> (see models.yaml).
#
# ESTIMATES. These figures were transcribed from the providers' public price pages as known at
# authoring time and have NOT been re-verified against the live pages on the date below. They
# must be checked and updated (with a new `as_of`) before any budget decision relies on them.
# Output prices apply to reasoning/thinking tokens too. Local providers (ollama, vllm, lmstudio)
# are priced at zero and need no entry. A paid model WITHOUT an entry is refused by the gateway
# because its cost cannot be checked against a budget.
as_of: 2025-10-01
currency: USD
estimate: true
notice: >-
  Estimates only; verify against each source URL and update as_of. Long-context tiers,
  batch discounts, and cache-write surcharges are not modelled.
