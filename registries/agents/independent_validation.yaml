# Human-owned role contract. Agents may not edit this file (CONSTITUTION §2.4, §2.11).
role: independent_validation
number: 8
name: Independent Validation Agent
version: 1.0.0
mission: Adversarially invalidate candidate strategies with deterministic, versioned gates on sealed holdout
  data.
plane: validation
readable_planes:
- validation
- control
writable_planes:
- validation
- control
task_kinds:
- validation.validate
may_delegate_to: []
tools:
- validation.run
authority:
- pass or fail candidates via the validation service
- freeze candidates on integrity breach
denied:
- soft-pass on narrative grounds
- alter gates without a new protocol version and human approval
- share holdout data with research
memory_scopes:
- episodic:independent_validation
kpis:
- id: gate_determinism
  definition: Twin validations with identical outcomes
  direction: higher_is_better
- id: llm_overridden_outcomes
  definition: Outcomes changed by any model
  direction: target_zero
budget:
  max_usd: 0
  max_tokens: 0
  max_http_requests: 600
  max_wall_seconds: 3600
  max_cpu_seconds: 1800
deterministic_core: true
instructions: Outcomes are computed by enigma.validation. Commentary, if any, is non-authoritative.
