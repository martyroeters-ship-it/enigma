# Enigma validation protocol 1.0.0 (M2 full suite). See docs/VALIDATION_PROTOCOL.md.
#
# Human-owned. Agents may read this file; they may never edit it. Changes require a new
# protocol version + pin update in enigma.validation.protocol.
#
# Promotes the former informative gates (G04, G08–G11, G15) to required. Default runtime
# protocol remains 0.1.0-slice until operators opt into 1.0.0 via ENIGMA_VALIDATION_PROTOCOL.

protocol_version: "1.0.0"
required_gates: [G01, G02, G03, G04, G06, G07, G08, G09, G10, G11, G12, G15, G16]
annualization_periods_per_year: 1095   # 8h bars: 3 per day * 365

gates:
  G01:
    name: pit_integrity
    max_violations: 0
  G02:
    name: chronological_split
    holdout_fraction: 0.30
    min_embargo_bars: 21
    embargo_horizon_multiple: 3
  G03:
    name: out_of_sample
    min_holdout_net_sharpe: 0.5
    min_holdout_bars: 270
    top_days_removed: 5
  G04:
    name: walk_forward
    n_folds: 6
    min_positive_fraction: 0.5
  G06:
    name: multiple_testing
    alpha: 0.05
    correction: holm_bonferroni
    require_registered_trials: true
  G07:
    name: deflated_sharpe
    min_dsr_probability: 0.95
  G08:
    name: pbo
    max_pbo: 0.5
    n_splits: 16
  G09:
    name: parameter_sensitivity
    relative_step: 0.10
    min_ratio: 0.5
  G10:
    name: regime_stress
    vol_window_bars: 21
    min_regime_bars: 30
  G11:
    name: bootstrap
    n_boot: 1000
    mean_block_bars: 10
    alpha: 0.05
  G12:
    name: costs
    cost_stress_multiplier: 2.0
    min_stressed_net_sharpe: 0.0
  G15:
    name: benchmark_dominance
    benchmarks: [flat, buy_and_hold_perp]
  G16:
    name: reproducibility
    max_abs_metric_delta: 1.0e-9
