# Sealed holdout boundary (human-owned; ADR-013, ADR-015).
#
# The research plane may only acquire data in [data_start, holdout_start - embargo_days).
# The validation plane acquires its own holdout data independently for
# [holdout_start, latest available]. The boundary is fixed (not rolling) so research cannot probe
# the holdout by moving it. Reuse of one holdout across many hypotheses is accounted for by the
# trial ledger (G06/G07); a fresh boundary requires a new protocol version.
data_start: "2020-01-01"
holdout_start: "2024-10-01"
embargo_days: 7
