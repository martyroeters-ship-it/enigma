# Enigma validation protocol 0.2.0-1h.
#
# Human-owned. This file does not replace protocol 0.1.0-slice. Eight-hour research
# continues to use that pinned protocol, and its sealed holdouts stay under that version.
#
# Sampling frequency is one hour. The label horizon, in sampling bars, is the holding
# period and is separate from the bar length. The embargo is at least seven days
# (168 one-hour bars), and longer when the holding period requires it.
# Annualization is 24 * 365 = 8760. Costs stay in basis points per unit of turnover.
# Funding is not assumed to settle every hour; the panel carries a rate only when a
# funding event falls inside the bar.

protocol_version: "0.2.0-1h"
sampling_frequency: "1h"
holding_period_note: "label_horizon_bars is the holding period in 1h bars, not the sampling frequency"
annualization_periods_per_year: 8760

required_gates: [G01, G02, G03, G06, G07, G12, G16]

gates:
  G01:
    name: pit_integrity
    max_violations: 0
  G02:
    name: chronological_split
    holdout_fraction: 0.30
    min_embargo_bars: 168
    embargo_horizon_multiple: 3
  G03:
    name: out_of_sample
    min_holdout_net_sharpe: 0.5
    min_holdout_bars: 2160
    top_days_removed: 5
  G06:
    name: multiple_testing
    alpha: 0.05
    correction: holm_bonferroni
    require_registered_trials: true
  G07:
    name: deflated_sharpe
    min_dsr_probability: 0.95
  G12:
    name: costs
    cost_stress_multiplier: 2.0
    min_stressed_net_sharpe: 0.0
  G16:
    name: reproducibility
    max_abs_metric_delta: 1.0e-9
