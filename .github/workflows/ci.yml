name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Allow unprivileged user namespaces (strategy sandbox, ADR-016)
        # Ubuntu 24.04 runners restrict them via AppArmor; the sandbox fails closed without them.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user --net -- /bin/true
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Plane import boundaries
        run: uv run lint-imports
      - name: Tests (offline)
        run: uv run pytest -m "not network" --cov=enigma --cov-report=term-missing:skip-covered

  network-smoke:
    # Real public APIs (arXiv, OpenAlex, Binance public archives). Non-blocking: external
    # availability must not gate merges, but failures are visible.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.10"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m network -v
